<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港免費電視節目表 - 全日24小時版</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for lightweight reactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased min-h-screen flex flex-col" x-data="tvApp()">

    <!-- Header -->
    <header class="bg-blue-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold flex items-center gap-3">
                    <i class="fa-solid fa-tv text-yellow-300"></i> 香港免費電視節目表
                </h1>
                <p class="text-blue-100 text-base mt-1">全日24小時節目時間表與未來7日預告</p>
            </div>
            <!-- Live Clock & Date -->
            <div class="flex items-center gap-4 bg-blue-800 border border-blue-600 px-5 py-3 rounded-xl text-base shadow-inner">
                <div class="flex items-center gap-2">
                    <i class="fa-regular fa-calendar text-yellow-300"></i>
                    <span x-text="formattedHeaderDate" class="font-medium"></span>
                </div>
                <div class="border-l border-blue-600 pl-4 flex items-center gap-2 font-mono font-bold text-lg text-yellow-300">
                    <i class="fa-regular fa-clock"></i>
                    <span x-text="currentTimeString"></span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8 flex-grow w-full">
        
        <!-- 7-Day Selector Bar -->
        <div class="mb-8 bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
            <h2 class="text-base font-bold text-gray-700 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-calendar-days text-blue-700"></i> 選擇查看日期 (全日節目表)
            </h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
                <template x-for="day in availableDays" :key="day.dateStr">
                    <button @click="selectedDateStr = day.dateStr"
                        :class="selectedDateStr === day.dateStr ? 'bg-blue-700 text-white shadow-md border-blue-700 scale-105' : 'bg-gray-50 text-gray-800 hover:bg-gray-100 border-gray-300'"
                        class="px-4 py-3 rounded-xl border-2 text-center transition flex flex-col items-center justify-center">
                        <span class="text-xs font-bold uppercase opacity-90" x-text="day.dayOfWeek"></span>
                        <span class="text-lg font-extrabold mt-0.5" x-text="day.displayDate"></span>
                        <span class="text-[11px] mt-1 font-medium px-2 py-0.5 rounded"
                            :class="selectedDateStr === day.dateStr ? 'bg-blue-800 text-yellow-200' : 'bg-gray-200 text-gray-700'"
                            x-text="day.isToday ? '今日' : ''"></span>
                    </button>
                </template>
            </div>
        </div>

        <!-- Controls & Search -->
        <div class="flex flex-col lg:flex-row justify-between items-center gap-4 mb-8 bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
            <!-- Search Bar -->
            <div class="relative w-full lg:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400 text-lg">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" x-model="searchQuery" placeholder="輸入節目名稱、頻道名稱或台號..." 
                    class="w-full pl-12 pr-4 py-3 bg-gray-50 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-blue-600 text-lg shadow-inner">
            </div>

            <div class="flex items-center gap-2 text-base font-bold text-blue-800 bg-blue-50 px-4 py-3 rounded-xl border border-blue-200 w-full lg:w-auto justify-center">
                <i class="fa-solid fa-circle-info"></i>
                <span x-text="'正在顯示全日節目: ' + getSelectedDateLabel()"></span>
            </div>
        </div>

        <!-- Loading State -->
        <div x-show="loading" class="flex flex-col items-center justify-center py-20">
            <i class="fa-solid fa-circle-notch fa-spin text-5xl text-blue-700 mb-4"></i>
            <p class="text-gray-600 text-lg font-medium">正在載入全日節目表...</p>
        </div>

        <!-- Schedule Grid -->
        <div x-show="!loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="channel in filteredChannels" :key="channel.id">
                <div class="bg-white rounded-2xl shadow-md border-2 border-gray-200 overflow-hidden flex flex-col hover:shadow-lg transition">
                    <!-- Channel Header -->
                    <div class="bg-blue-50 px-6 py-4 border-b-2 border-gray-200 flex justify-between items-center">
                        <div>
                            <span class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-md bg-green-200 text-green-900">
                                免費電視
                            </span>
                            <h2 class="text-xl font-extrabold text-gray-900 mt-1.5" x-text="channel.name"></h2>
                        </div>
                        <span class="text-base font-bold bg-white border-2 border-blue-300 px-3.5 py-1.5 rounded-full text-blue-800 shadow-sm" x-text="'第 ' + channel.channelNumber + ' 台'"></span>
                    </div>

                    <!-- Program List (Full Day) -->
                    <div class="divide-y-2 divide-gray-100 flex-grow max-h-[500px] overflow-y-auto">
                        <template x-for="program in channel.programs" :key="program.time">
                            <div class="p-4 transition flex items-start gap-3"
                                :class="isTodaySelected() && isCurrentProgram(program, channel.programs) ? 'bg-yellow-50 border-l-8 border-yellow-500' : 'hover:bg-gray-50'">
                                <span class="text-xs font-mono font-bold px-2.5 py-1.5 rounded-lg mt-0.5 flex-shrink-0 shadow-sm"
                                    :class="isTodaySelected() && isCurrentProgram(program, channel.programs) ? 'bg-yellow-500 text-gray-900' : 'bg-gray-200 text-gray-800'"
                                    x-text="program.time"></span>
                                
                                <div class="flex-grow">
                                    <div class="flex items-center flex-wrap gap-2 mb-0.5">
                                        <h3 class="text-base font-bold text-gray-900" x-text="program.title"></h3>
                                        <!-- Live Badge -->
                                        <template x-if="isTodaySelected() && isCurrentProgram(program, channel.programs)">
                                            <span class="inline-flex items-center gap-1 bg-red-600 text-white text-[10px] font-extrabold px-1.5 py-0.5 rounded uppercase tracking-wider shadow-sm animate-pulse">
                                                <span class="w-1.5 h-1.5 bg-white rounded-full"></span> 直播
                                            </span>
                                        </template>
                                        <!-- Upcoming Badge -->
                                        <template x-if="isTodaySelected() && isUpcomingProgram(program)">
                                            <span class="text-[10px] bg-gray-200 text-gray-700 font-bold px-1.5 py-0.5 rounded">
                                                稍后
                                            </span>
                                        </template>
                                    </div>
                                    <p class="text-xs text-gray-600 leading-relaxed" x-text="program.description"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <!-- Empty State -->
        <div x-show="!loading && filteredChannels.length === 0" class="text-center py-20 bg-white rounded-2xl shadow-sm border border-gray-200 mt-4">
            <i class="fa-regular fa-folder-open text-5xl text-gray-300 mb-4"></i>
            <p class="text-gray-600 text-lg font-bold">找不到符合條件的頻道或節目。</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-12 py-6 text-center text-sm text-gray-600">
        <p>香港免費電視節目表 &bull; 全日24小時節目表 &bull; 長者友善大字版</p>
    </footer>

    <!-- Application Script -->
    <script>
        function tvApp() {
            const today = new Date();
            const daysList = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                const dateStr = `${year}-${month}-${day}`;
                
                daysList.push({
                    dateStr: dateStr,
                    dayOfWeek: d.toLocaleDateString('zh-HK', { weekday: 'short' }),
                    displayDate: d.toLocaleDateString('zh-HK', { month: 'numeric', day: 'numeric' }),
                    isToday: i === 0
                });
            }

            // Standard sample full-day programs generator for demonstration across channels
            const standardFullDayPrograms = [
                { time: '06:00', title: '早晨新聞及財經', description: '早間重點新聞及金融市場早段走勢。' },
                { time: '08:30', title: '晨光第一線 / 資訊節目', description: '輕鬆生活資訊、消閒及健康專題。' },
                { time: '10:00', title: '精選早間劇集 / 紀錄片', description: '皇牌外購劇集重溫或自然人文紀實。' },
                { time: '12:00', title: '午間新聞報道', description: '中午快訊，全面跟進半日最新時事。' },
                { time: '13:00', title: '午後消閒綜合節目', description: '烹飪、旅遊、潮流時尚資訊。' },
                { time: '16:00', title: '兒童天地 / 動畫世界', description: '合家歡及青少年益智動畫節目。' },
                { time: '18:00', title: '晚間新聞與地方快訊', description: '報道本地及世界各地最新重點新聞。' },
                { time: '19:30', title: '黃金時事與綜藝熱話', description: '深入探討社會熱話、民生及娛樂綜藝。' },
                { time: '20:30', title: '黃金檔皇牌連續劇 / 特備節目', description: '壓軸大戲、強檔電影或大型綜藝直播。' },
                { time: '22:30', title: '深宵晚間新聞 / 財經總結', description: '總結全日重要新聞、政經與國際動向。' },
                { time: '23:30', title: '深夜消閒劇集 / 音樂特輯', description: '夜間重溫經典劇集或音樂節目。' }
            ];

            return {
                loading: true,
                searchQuery: '',
                now: new Date(),
                availableDays: daysList,
                selectedDateStr: daysList[0].dateStr,
                channels: [],

                init() {
                    setInterval(() => {
                        this.now = new Date();
                    }, 1000);

                    setTimeout(() => {
                        this.channels = [
                            { id: 'rthk_31', name: '港台電視 31', channelNumber: '31', programs: standardFullDayPrograms },
                            { id: 'rthk_32', name: '港台電視 32', channelNumber: '32', programs: standardFullDayPrograms },
                            { id: 'rthk_33', name: '港台電視 33', channelNumber: '33', programs: standardFullDayPrograms },
                            { id: 'rthk_35', name: '港台電視 35', channelNumber: '35', programs: standardFullDayPrograms },
                            { id: 'hoy_76', name: 'HOY 國際財經台', channelNumber: '76', programs: standardFullDayPrograms },
                            { id: 'hoy_77', name: 'HOY TV', channelNumber: '77', programs: standardFullDayPrograms },
                            { id: 'hoy_78', name: 'HOY 體育台', channelNumber: '78', programs: standardFullDayPrograms },
                            { id: 'tvb_jade', name: '翡翠台 (TVB Jade)', channelNumber: '81', programs: standardFullDayPrograms },
                            { id: 'tvb_plus', name: 'TVB Plus', channelNumber: '82', programs: standardFullDayPrograms },
                            { id: 'tvb_news', name: '無綫新聞台', channelNumber: '83', programs: standardFullDayPrograms },
                            { id: 'tvb_pearl', name: '明珠台 (TVB Pearl)', channelNumber: '84', programs: standardFullDayPrograms },
                            { id: 'tvb_info', name: '無綫財經 資訊台', channelNumber: '85', programs: standardFullDayPrograms },
                            { id: 'viutv_96', name: 'ViuTVsix', channelNumber: '96', programs: standardFullDayPrograms },
                            { id: 'viutv_99', name: 'ViuTV', channelNumber: '99', programs: standardFullDayPrograms }
                        ];
                        this.loading = false;
                    }, 300);
                },

                get formattedHeaderDate() {
                    return this.now.toLocaleDateString('zh-HK', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
                },

                get currentTimeString() {
                    return this.now.toLocaleTimeString('zh-HK', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                },

                getSelectedDateLabel() {
                    const found = this.availableDays.find(d => d.dateStr === this.selectedDateStr);
                    return found ? `${found.displayDate} (${found.dayOfWeek})` : this.selectedDateStr;
                },

                isTodaySelected() {
                    return this.selectedDateStr === this.availableDays[0].dateStr;
                },

                timeToMinutes(timeStr) {
                    const [hours, minutes] = timeStr.split(':').map(Number);
                    return hours * 60 + minutes;
                },

                getCurrentTimeMinutes() {
                    return this.now.getHours() * 60 + this.now.getMinutes();
                },

                isCurrentProgram(program, allPrograms) {
                    if (!this.isTodaySelected()) return false;
                    const currentMins = this.getCurrentTimeMinutes();
                    const index = allPrograms.findIndex(p => p.time === program.time);
                    const startTime = this.timeToMinutes(program.time);

                    if (index === allPrograms.length - 1) {
                        return currentMins >= startTime;
                    }

                    const nextStartTime = this.timeToMinutes(allPrograms[index + 1].time);
                    return currentMins >= startTime && currentMins < nextStartTime;
                },

                isUpcomingProgram(program) {
                    if (!this.isTodaySelected()) return false;
                    const currentMins = this.getCurrentTimeMinutes();
                    const startTime = this.timeToMinutes(program.time);
                    return startTime > currentMins;
                },

                get filteredChannels() {
                    return this.channels.filter(channel => {
                        const query = this.searchQuery.toLowerCase();
                        return channel.name.toLowerCase().includes(query) || 
                            channel.channelNumber.toLowerCase().includes(query) ||
                            channel.programs.some(p => p.title.toLowerCase().includes(query) || p.description.toLowerCase().includes(query));
                    });
                }
            }
        }
    </script>
</body>
</html>
