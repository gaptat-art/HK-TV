<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trip Expense & Currency Calculator</title>
    <!-- Tailwind CSS for modern mobile-first styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans" x-data="tripApp()">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight text-blue-400">✈️ TripWallet</h1>
            <div class="text-sm bg-slate-700 px-3 py-1 rounded-full text-slate-300">
                <span x-text="trips.length"></span> Trips
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24 space-y-6">

        <!-- NO TRIPS STATE -->
        <template x-if="trips.length === 0">
            <div class="text-center py-12 space-y-4">
                <div class="text-5xl">🎒</div>
                <h2 class="text-lg font-semibold">No trips added yet</h2>
                <p class="text-sm text-slate-400">Create your first trip to start tracking expenses and currencies.</p>
                <button @click="openNewTripModal = true" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-2.5 rounded-xl shadow-lg transition">
                    + Add New Trip
                </button>
            </div>
        </template>

        <!-- ACTIVE TRIP VIEW -->
        <template x-if="trips.length > 0 && activeTrip">
            <div class="space-y-6">
                
                <!-- Trip Selector & Controls -->
                <div class="flex items-center justify-between bg-slate-800 p-3 rounded-2xl border border-slate-700">
                    <select x-model="activeTripId" class="bg-transparent text-white font-semibold outline-none w-full pr-2">
                        <template x-for="trip in trips" :key="trip.id">
                            <option :value="trip.id" x-text="trip.name" class="bg-slate-800 text-white"></option>
                        </template>
                    </select>
                    <button @click="openNewTripModal = true" class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-blue-300 font-medium whitespace-nowrap ml-2">
                        + New
                    </button>
                </div>

                <!-- Summary Card -->
                <div class="bg-gradient-to-br from-blue-900/40 to-slate-800 p-5 rounded-2xl border border-blue-500/30 shadow-lg space-y-3">
                    <div class="flex justify-between items-center text-xs text-slate-400 uppercase tracking-wider">
                        <span>Total Spent (<span x-text="activeTrip.homeCurrency"></span>)</span>
                        <span>Exchange Rate</span>
                    </div>
                    <div class="flex justify-between items-baseline">
                        <span class="text-3xl font-extrabold text-white" x-text="activeTrip.homeCurrency + ' ' + totalSpentHome.toFixed(2)"></span>
                        <div class="text-right">
                            <span class="text-sm font-medium text-slate-300" x-text="'1 ' + activeTrip.foreignCurrency + ' = ' + activeTrip.exchangeRate + ' ' + activeTrip.homeCurrency"></span>
                            <button @click="editRate()" class="block text-xs text-blue-400 hover:underline mt-0.5">Edit Rate</button>
                        </div>
                    </div>
                </div>

                <!-- Quick Currency Converter Widget -->
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Quick Converter</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1" x-text="activeTrip.foreignCurrency"></label>
                            <input type="number" inputmode="decimal" x-model.number="quickForeign" @input="convertFromForeign()" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1" x-text="activeTrip.homeCurrency"></label>
                            <input type="number" inputmode="decimal" x-model.number="quickHome" @input="convertFromHome()" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                        </div>
                    </div>
                </div>

                <!-- Expense Actions -->
                <div class="flex gap-3">
                    <button @click="openExpenseModal = true" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl shadow-lg transition text-center">
                        + Add Expense
                    </button>
                    <button @click="deleteCurrentTrip()" class="bg-slate-800 hover:bg-red-900/40 text-red-400 border border-slate-700 hover:border-red-500/40 px-4 rounded-xl transition text-sm">
                        🗑️
                    </button>
                </div>

                <!-- Expense History List -->
                <div class="space-y-3">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Expense History</h3>
                    
                    <template x-if="activeTrip.expenses.length === 0">
                        <div class="text-center py-8 bg-slate-800/50 rounded-2xl border border-dashed border-slate-700 text-slate-400 text-sm">
                            No expenses logged yet. Tap above to add one!
                        </div>
                    </template>

                    <div class="space-y-2">
                        <template x-for="expense in activeTrip.expenses" :key="expense.id">
                            <div class="bg-slate-800 p-3.5 rounded-xl border border-slate-700 flex justify-between items-center">
                                <div>
                                    <div class="font-medium text-white text-sm" x-text="expense.title"></div>
                                    <div class="text-xs text-slate-400 flex gap-2 mt-0.5">
                                        <span x-text="expense.date"></span>
                                        <span>•</span>
                                        <span class="bg-slate-700 px-1.5 py-0.5 rounded text-slate-300" x-text="expense.category"></span>
                                    </div>
                                </div>
                                <div class="text-right flex items-center gap-3">
                                    <div>
                                        <div class="text-sm font-bold text-white" x-text="activeTrip.foreignCurrency + ' ' + expense.amount.toFixed(2)"></div>
                                        <div class="text-xs text-slate-400" x-text="activeTrip.homeCurrency + ' ' + (expense.amount * activeTrip.exchangeRate).toFixed(2)"></div>
                                    </div>
                                    <button @click="deleteExpense(expense.id)" class="text-slate-500 hover:text-red-400 text-sm p-1">✕</button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

            </div>
        </template>

    </main>

    <!-- MODAL: New Trip -->
    <div x-show="openNewTripModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 z-50" style="display: none;">
        <div class="bg-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 border border-slate-700 space-y-4 shadow-2xl">
            <h2 class="text-lg font-bold text-white">Create New Trip</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Trip Name (e.g., Tokyo Spring)</label>
                    <input type="text" x-model="newTripForm.name" placeholder="Japan Trip" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Home Currency</label>
                        <input type="text" x-model="newTripForm.homeCurrency" placeholder="HKD" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white uppercase focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Foreign Currency</label>
                        <input type="text" x-model="newTripForm.foreignCurrency" placeholder="JPY" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white uppercase focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Exchange Rate (1 Foreign = ? Home)</label>
                    <input type="number" inputmode="decimal" x-model.number="newTripForm.exchangeRate" placeholder="0.052" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="flex gap-3 pt-2">
                <button @click="openNewTripModal = false" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-medium py-2.5 rounded-xl transition">Cancel</button>
                <button @click="createTrip()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl transition">Save Trip</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Add Expense -->
    <div x-show="openExpenseModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 z-50" style="display: none;">
        <div class="bg-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 border border-slate-700 space-y-4 shadow-2xl" x-data="{ title: '', amount: '', category: 'Food' }">
            <h2 class="text-lg font-bold text-white">Add Expense</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Description</label>
                    <input type="text" x-model="title" placeholder="Ramen lunch" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1" x-text="'Amount (' + activeTrip.foreignCurrency + ')'"></label>
                    <input type="number" inputmode="decimal" x-model.number="amount" placeholder="1200" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Category</label>
                    <select x-model="category" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                        <option value="Food">🍽️ Food & Drink</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Transport">🚆 Transport</option>
                        <option value="Hotel">🏨 Hotel / Stay</option>
                        <option value="Activity">🎟️ Activity / Ticket</option>
                        <option value="Other">📦 Other</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-3 pt-2">
                <button @click="openExpenseModal = false" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-medium py-2.5 rounded-xl transition">Cancel</button>
                <button @click="addExpense(title, amount, category); openExpenseModal = false; title=''; amount='';" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl transition">Add</button>
            </div>
        </div>
    </div>

    <!-- Alpine JS App Logic -->
    <script>
        function tripApp() {
            return {
                trips: JSON.parse(localStorage.getItem('tripwallet_trips')) || [],
                activeTripId: localStorage.getItem('tripwallet_active') || null,
                openNewTripModal: false,
                openExpenseModal: false,
                
                newTripForm: {
                    name: '',
                    homeCurrency: 'HKD',
                    foreignCurrency: 'JPY',
                    exchangeRate: 0.052
                },

                quickForeign: '',
                quickHome: '',

                get activeTrip() {
                    if (!this.activeTripId && this.trips.length > 0) {
                        this.activeTripId = this.trips[0].id;
                    }
                    return this.trips.find(t => t.id === this.activeTripId) || null;
                },

                get totalSpentHome() {
                    if (!this.activeTrip) return 0;
                    const totalForeign = this.activeTrip.expenses.reduce((sum, exp) => sum + exp.amount, 0);
                    return totalForeign * this.activeTrip.exchangeRate;
                },

                init() {
                    this.$watch('trips', (val) => {
                        localStorage.setItem('tripwallet_trips', JSON.stringify(val));
                    });
                    this.$watch('activeTripId', (val) => {
                        localStorage.setItem('tripwallet_active', val);
                    });
                },

                createTrip() {
                    if (!this.newTripForm.name) return;
                    const newTrip = {
                        id: Date.now().toString(),
                        name: this.newTripForm.name,
                        homeCurrency: this.newTripForm.homeCurrency.toUpperCase(),
                        foreignCurrency: this.newTripForm.foreignCurrency.toUpperCase(),
                        exchangeRate: Number(this.newTripForm.exchangeRate) || 1,
                        expenses: []
                    };
                    this.trips.push(newTrip);
                    this.activeTripId = newTrip.id;
                    this.newTripForm.name = '';
                    this.openNewTripModal = false;
                },

                deleteCurrentTrip() {
                    if (confirm('Are you sure you want to delete this trip and all its expenses?')) {
                        this.trips = this.trips.filter(t => t.id !== this.activeTripId);
                        this.activeTripId = this.trips.length > 0 ? this.trips[0].id : null;
                    }
                },

                addExpense(title, amount, category) {
                    if (!amount || amount <= 0) return;
                    const newExp = {
                        id: Date.now().toString(),
                        title: title || 'Untitled Expense',
                        amount: Number(amount),
                        category: category,
                        date: new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
                    };
                    this.activeTrip.expenses.unshift(newExp);
                    // trigger reactivity update
                    this.trips = [...this.trips];
                },

                deleteExpense(expenseId) {
                    this.activeTrip.expenses = this.activeTrip.expenses.filter(e => e.id !== expenseId);
                    this.trips = [...this.trips];
                },

                editRate() {
                    const newRate = prompt('Enter new exchange rate (1 ' + this.activeTrip.foreignCurrency + ' = ? ' + this.activeTrip.homeCurrency + '):', this.activeTrip.exchangeRate);
                    if (newRate !== null && !isNaN(newRate) && newRate > 0) {
                        this.activeTrip.exchangeRate = Number(newRate);
                        this.trips = [...this.trips];
                    }
                },

                convertFromForeign() {
                    if (this.activeTrip && this.quickForeign !== '') {
                        this.quickHome = Number((this.quickForeign * this.activeTrip.exchangeRate).toFixed(2));
                    } else {
                        this.quickHome = '';
                    }
                },

                convertFromHome() {
                    if (this.activeTrip && this.quickHome !== '' && this.activeTrip.exchangeRate > 0) {
                        this.quickForeign = Number((this.quickHome / this.activeTrip.exchangeRate).toFixed(2));
                    } else {
                        this.quickForeign = '';
                    }
                }
            }
        }
    </script>
</body>
</html>
