<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港免費電視節目表 - 長者友善版</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for lightweight reactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased min-h-screen flex flex-col" x-data="tvApp()">

    <!-- Header -->
    <header class="bg-blue-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold flex items-center gap-3">
                    <i class="fa-solid fa-tv text-yellow-300"></i> 香港免費電視節目表
                </h1>
                <p class="text-blue-100 text-base mt-1">輕鬆查看各大免費電視台的直播與精彩節目</p>
            </div>
            <!-- Live Clock & Date -->
            <div class="flex items-center gap-4 bg-blue-800 border border-blue-600 px-5 py-3 rounded-xl text-base shadow-inner">
                <div class="flex items-center gap-2">
                    <i class="fa-regular fa-calendar text-yellow-300"></i>
                    <span x-text="formattedDate" class="font-medium"></span>
                </div>
                <div class="border-l border-blue-600 pl-4 flex items-center gap-2 font-mono font-bold text-lg text-yellow-300">
                    <i class="fa-regular fa-clock"></i>
                    <span x-text="currentTimeString"></span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8 flex-grow w-full">
        
        <!-- Controls & Channel Filter -->
        <div class="flex flex-col lg:flex-row justify-between items-center gap-4 mb-8 bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
            <!-- Search Bar -->
            <div class="relative w-full lg:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400 text-lg">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" x-model="searchQuery" placeholder="輸入節目名稱或頻道..." 
                    class="w-full pl-12 pr-4 py-3 bg-gray-50 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-blue-600 text-lg shadow-inner">
            </div>

            <!-- Channel Category Tabs (Simplified to Free TV only) -->
            <div class="flex gap-3 w-full lg:w-auto">
                <button class="bg-blue-700 text-white shadow-md px-6 py-3 rounded-xl text-base font-bold transition flex-1 sm:flex-none">
                    免費電視頻道
                </button>
            </div>
        </div>

        <!-- Loading State -->
        <div x-show="loading" class="flex flex-col items-center justify-center py-20">
            <i class="fa-solid fa-circle-notch fa-spin text-5xl text-blue-700 mb-4"></i>
            <p class="text-gray-600 text-lg font-medium">正在載入電視節目表...</p>
        </div>

        <!-- Schedule Grid -->
        <div x-show="!loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="channel in filteredChannels" :key="channel.id">
                <div class="bg-white rounded-2xl shadow-md border-2 border-gray-200 overflow-hidden flex flex-col hover:shadow-lg transition">
                    <!-- Channel Header -->
                    <div class="bg-blue-50 px-6 py-4 border-b-2 border-gray-200 flex justify-between items-center">
                        <div>
                            <span class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-md bg-green-200 text-green-900">
                                免費電視
                            </span>
                            <h2 class="text-xl font-extrabold text-gray-900 mt-1.5" x-text="channel.name"></h2>
                        </div>
                        <span class="text-base font-bold bg-white border-2 border-blue-300 px-3.5 py-1.5 rounded-full text-blue-800 shadow-sm" x-text="'第 ' + channel.channelNumber + ' 台'"></span>
                    </div>

                    <!-- Program List -->
                    <div class="divide-y-2 divide-gray-100 flex-grow">
                        <template x-for="program in channel.programs" :key="program.time">
                            <div class="p-5 transition flex items-start gap-4"
                                :class="isCurrentProgram(program, channel.programs) ? 'bg-yellow-50 border-l-8 border-yellow-500' : 'hover:bg-gray-50'">
                                <span class="text-sm font-mono font-bold px-3 py-1.5 rounded-lg mt-0.5 flex-shrink-0 shadow-sm"
                                    :class="isCurrentProgram(program, channel.programs) ? 'bg-yellow-500 text-gray-900' : 'bg-gray-200 text-gray-800'"
                                    x-text="program.time"></span>
                                
                                <div class="flex-grow">
                                    <div class="flex items-center flex-wrap gap-2 mb-1">
                                        <h3 class="text-lg font-bold text-gray-900" x-text="program.title"></h3>
                                        <!-- Live Badge -->
                                        <template x-if="isCurrentProgram(program, channel.programs)">
                                            <span class="inline-flex items-center gap-1.5 bg-red-600 text-white text-xs font-extrabold px-2 py-0.5 rounded-md uppercase tracking-wider shadow-sm animate-pulse">
                                                <span class="w-2 h-2 bg-white rounded-full"></span> 現正直播
                                            </span>
                                        </template>
                                        <!-- Upcoming Badge -->
                                        <template x-if="isUpcomingProgram(program)">
                                            <span class="text-xs bg-gray-200 text-gray-700 font-bold px-2 py-0.5 rounded-md">
                                                稍后播放
                                            </span>
                                        </template>
                                    </div>
                                    <p class="text-sm text-gray-600 leading-relaxed" x-text="program.description"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <!-- Empty State -->
        <div x-show="!loading && filteredChannels.length === 0" class="text-center py-20 bg-white rounded-2xl shadow-sm border border-gray-200 mt-4">
            <i class="fa-regular fa-folder-open text-5xl text-gray-300 mb-4"></i>
            <p class="text-gray-600 text-lg font-bold">找不到符合條件的頻道或節目。</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-12 py-6 text-center text-sm text-gray-600">
        <p>香港免費電視節目表 &bull; 長者友善大字版 &bull; 適用於手機及平板電腦</p>
    </footer>

    <!-- Application Script -->
    <script>
        function tvApp() {
            return {
                loading: true,
                searchQuery: '',
                now: new Date(),
                channels: [],

                init() {
                    // Update live clock every second
                    setInterval(() => {
                        this.now = new Date();
                    }, 1000);

                    // Load Free-to-Air channels only
                    setTimeout(() => {
                        this.channels = [
                            {
                                id: 'tvb_jade',
                                name: '翡翠台 (TVB Jade)',
                                channelNumber: '81',
                                programs: [
                                    { time: '18:30', title: '六點半新聞報道', description: '報道本地及世界各地最新重點新聞。' },
                                    { time: '19:35', title: '東張西望', description: '深入探討社會熱話、民生及突發事件。' },
                                    { time: '20:30', title: '愛．回家之開心速遞', description: '輕鬆惹笑的皇牌長壽處境喜劇。' },
                                    { time: '21:30', title: '黃金檔精選連續劇', description: '匯聚實力派演員的重頭壓軸劇集。' },
                                    { time: '23:15', title: '晚間新聞', description: '總結全日重要新聞與財經動向。' }
                                ]
                            },
                            {
                                id: 'tvb_news',
                                name: '無綫新聞台 (TVB News)',
                                channelNumber: '83',
                                programs: [
                                    { time: '18:00', title: '香港早午晚直擊', description: '無間斷提供最新本地及國際快訊。' },
                                    { time: '20:00', title: '焦點專題', description: '深入分析社會與經濟熱門議題。' },
                                    { time: '21:00', title: '兩岸國際', description: '追蹤環球政經最新形勢。' },
                                    { time: '22:00', title: '新聞檔案', description: '回顧歷史檔案與重要時刻。' }
                                ]
                            },
                            {
                                id: 'viutv_99',
                                name: 'ViuTV',
                                channelNumber: '99',
                                programs: [
                                    { time: '18:30', title: '6點新聞報道', description: '為觀眾提供客觀的晚間新聞。' },
                                    { time: '19:30', title: '真人騷與綜藝節目', description: '輕鬆具創意的娛樂及紀實節目。' },
                                    { time: '21:30', title: '原創劇集', description: '題材嶄新的當代劇作。' },
                                    { time: '22:30', title: '深宵傾談與消閒', description: '輕鬆訪談及生活消閒節目。' }
                                ]
                            },
                            {
                                id: 'hoichun_77',
                                name: 'HOY TV',
                                channelNumber: '77',
                                programs: [
                                    { time: '18:00', title: 'HOY 晚間新聞', description: '緊貼本地民生及國際視野。' },
                                    { time: '19:00', title: '環球滋味遊', description: '介紹各地特色美食與風光。' },
                                    { time: '20:30', title: '人文紀實系列', description: '發掘動人故事及文化歷史。' },
                                    { time: '22:00', title: '精選外購劇', description: '追看性價比高的大熱劇集。' }
                                ]
                            },
                            {
                                id: 'rthk_31',
                                name: '港台電視 31 (RTHK 31)',
                                channelNumber: '31',
                                programs: [
                                    { time: '18:30', title: '香港電台新聞', description: '公共廣播新聞報道。' },
                                    { time: '19:30', title: '文化長廊', description: '展示本地藝術、文化及歷史傳承。' },
                                    { time: '20:30', title: '香港故事', description: '細訴香港人的奮鬥與生活點滴。' },
                                    { time: '22:00', title: '國際自然與科學', description: '探索大自然奧秘與世界科學發展。' }
                                ]
                            }
                        ];
                        this.loading = false;
                    }, 300);
                },

                get formattedDate() {
                    return this.now.toLocaleDateString('zh-HK', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
                },

                get currentTimeString() {
                    return this.now.toLocaleTimeString('zh-HK', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                },

                timeToMinutes(timeStr) {
                    const [hours, minutes] = timeStr.split(':').map(Number);
                    return hours * 60 + minutes;
                },

                getCurrentTimeMinutes() {
                    return this.now.getHours() * 60 + this.now.getMinutes();
                },

                isCurrentProgram(program, allPrograms) {
                    const currentMins = this.getCurrentTimeMinutes();
                    const index = allPrograms.findIndex(p => p.time === program.time);
                    const startTime = this.timeToMinutes(program.time);

                    if (index === allPrograms.length - 1) {
                        return currentMins >= startTime;
                    }

                    const nextStartTime = this.timeToMinutes(allPrograms[index + 1].time);
                    return currentMins >= startTime && currentMins < nextStartTime;
                },

                isUpcomingProgram(program) {
                    const currentMins = this.getCurrentTimeMinutes();
                    const startTime = this.timeToMinutes(program.time);
                    return startTime > currentMins;
                },

                get filteredChannels() {
                    return this.channels.filter(channel => {
                        const query = this.searchQuery.toLowerCase();
                        return channel.name.toLowerCase().includes(query) || 
                            channel.programs.some(p => p.title.toLowerCase().includes(query) || p.description.toLowerCase().includes(query));
                    });
                }
            }
        }
    </script>
</body>
</html>
