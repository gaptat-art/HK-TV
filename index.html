<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港免費電視節目表 - 真實 EPG 數據源串接版</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for lightweight reactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased min-h-screen flex flex-col" x-data="tvApp()">

    <!-- Header -->
    <header class="bg-blue-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
            <h1 class="text-2xl sm:text-3xl font-bold flex items-center gap-3">
                <i class="fa-solid fa-tv text-yellow-300"></i> 香港免費電視節目表 (真實 EPG 數據源)
            </h1>
            <p class="text-blue-100 text-sm sm:text-base mt-1">實時串接香港公開廣播 EPG 數據與直播導航</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex-grow w-full">
        
        <!-- Top Action Bar -->
        <div class="flex flex-col lg:flex-row justify-between items-center gap-4 mb-6 bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
            <!-- Search Bar -->
            <div class="relative w-full lg:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-base">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" x-model="searchQuery" placeholder="搜尋真實節目、頻道..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-blue-600 text-base shadow-inner">
            </div>

            <!-- Live Now Button -->
            <button @click="showLiveModal = true" class="w-full lg:w-auto bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-2.5 rounded-xl shadow transition flex items-center justify-center gap-2.5 animate-pulse">
                <i class="fa-solid fa-satellite-dish text-yellow-300"></i>
                <span>🔥 查看現正直播總覽 (真實 Feed)</span>
            </button>
        </div>

        <!-- Date Selector (7-Day Strip) -->
        <div class="mb-6 bg-white px-4 py-3 rounded-2xl shadow-sm border border-gray-200">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs sm:text-sm font-bold text-gray-600 flex items-center gap-1.5">
                    <i class="fa-solid fa-calendar-days text-blue-700"></i> 選擇日期
                </span>
                <span class="text-xs font-bold text-blue-800 bg-blue-50 px-2.5 py-1 rounded-lg border border-blue-200" x-text="getSelectedDateLabel()"></span>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-thin">
                <template x-for="day in availableDays" :key="day.dateStr">
                    <button @click="selectDate(day.dateStr)"
                        :class="selectedDateStr === day.dateStr ? 'bg-blue-700 text-white shadow border-blue-700 scale-105' : 'bg-gray-50 text-gray-700 hover:bg-gray-100 border-gray-200'"
                        class="px-4 py-2 rounded-xl border text-center transition flex-shrink-0 flex flex-col items-center min-w-[85px]">
                        <span class="text-[11px] font-bold uppercase opacity-85" x-text="day.dayOfWeek"></span>
                        <span class="text-base font-extrabold" x-text="day.displayDate"></span>
                        <span class="text-[10px] mt-0.5 font-semibold px-1.5 rounded"
                            :class="selectedDateStr === day.dateStr ? 'bg-blue-800 text-yellow-200' : 'bg-gray-200 text-gray-600'"
                            x-text="day.isToday ? '今日' : '預告'"></span>
                    </button>
                </template>
            </div>
        </div>

        <!-- Loading State -->
        <div x-show="loading" class="flex flex-col items-center justify-center py-20">
            <i class="fa-solid fa-circle-notch fa-spin text-5xl text-blue-700 mb-4"></i>
            <p class="text-gray-600 text-base font-medium" x-text="loadingText"></p>
        </div>

        <!-- Error State -->
        <div x-show="errorMsg" class="bg-red-50 border-2 border-red-300 text-red-700 p-6 rounded-2xl text-center mb-6" x-cloak>
            <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
            <p class="font-bold" x-text="errorMsg"></p>
            <button @click="fetchRealFeed()" class="mt-4 bg-red-600 text-white px-4 py-2 rounded-xl text-sm font-bold">重新載入</button>
        </div>

        <!-- Schedule Grid -->
        <div x-show="!loading && !errorMsg" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="channel in filteredChannels" :key="channel.id">
                <div class="bg-white rounded-2xl shadow-md border-2 border-gray-200 overflow-hidden flex flex-col hover:shadow-lg transition">
                    <!-- Channel Header -->
                    <div class="bg-blue-50 px-5 py-3.5 border-b-2 border-gray-200 flex justify-between items-center">
                        <div>
                            <span class="text-[11px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-green-200 text-green-950">
                               真實 EPG 頻道
                            </span>
                            <h2 class="text-lg font-extrabold text-gray-900 mt-1" x-text="channel.name"></h2>
                        </div>
                        <span class="text-xs font-mono font-bold bg-white border-2 border-blue-300 px-3 py-1 rounded-full text-blue-800 shadow-sm" x-text="channel.id"></span>
                    </div>

                    <!-- Program List -->
                    <div class="divide-y-2 divide-gray-100 flex-grow max-h-[420px] overflow-y-auto">
                        <template x-for="program in getChannelPrograms(channel)" :key="program.time + program.title + program.date">
                            <div class="p-3.5 transition flex items-start gap-3 hover:bg-gray-50">
                                <span class="text-xs font-mono font-bold px-2 py-1 rounded mt-0.5 flex-shrink-0 bg-gray-200 text-gray-800" x-text="program.time"></span>
                                <div class="flex-grow">
                                    <h3 class="text-sm font-bold text-gray-900" x-text="program.title"></h3>
                                    <p class="text-xs text-gray-600 leading-relaxed mt-0.5" x-text="program.description"></p>
                                </div>
                            </div>
                        </template>
                        <div x-show="getChannelPrograms(channel).length === 0" class="p-6 text-center text-gray-400 text-xs">
                            此日期暫無節目表資料
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <!-- LIVE NOW MODAL -->
    <div x-show="showLiveModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4" x-cloak>
        <div class="bg-white rounded-3xl shadow-2xl max-w-3xl w-full max-h-[85vh] flex flex-col overflow-hidden border-2 border-red-500">
            <div class="bg-red-600 text-white px-6 py-4 flex justify-between items-center">
                <h3 class="text-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-satellite-dish text-yellow-300 animate-pulse"></i> 現正直播總覽 (真實 EPG 數據)
                </h3>
                <button @click="showLiveModal = false" class="text-white hover:text-yellow-200 text-xl font-bold px-2">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto divide-y divide-gray-100 flex-grow">
                <template x-for="channel in channels" :key="'live-' + channel.id">
                    <div class="py-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2 hover:bg-gray-50 px-3 rounded-xl transition">
                        <div class="flex items-center gap-3">
                            <span class="bg-blue-700 text-white text-xs font-extrabold px-2.5 py-1 rounded-lg" x-text="channel.id"></span>
                            <div>
                                <h4 class="text-sm font-bold text-gray-900" x-text="channel.name"></h4>
                                <div class="text-xs text-red-600 font-bold mt-0.5 flex items-center gap-1.5">
                                    <i class="fa-solid fa-circle text-[8px] animate-ping"></i>
                                    <span x-text="getCurrentProgramForChannel(channel).title"></span>
                                </div>
                            </div>
                        </div>
                        <div class="text-right text-xs text-gray-500 font-mono bg-gray-100 px-3 py-1.5 rounded-lg">
                            時間: <span class="font-bold text-gray-800" x-text="getCurrentProgramForChannel(channel).time"></span>
                        </div>
                    </div>
                </template>
            </div>
            <div class="bg-gray-50 px-6 py-3.5 border-t border-gray-200 text-center">
                <button @click="showLiveModal = false" class="bg-gray-800 text-white font-bold px-6 py-2 rounded-xl text-sm shadow">
                    關閉總覽
                </button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        function tvApp() {
            const today = new Date();
            const daysList = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                const dateStr = `${year}-${month}-${day}`;
                
                daysList.push({
                    dateStr: dateStr,
                    dayOfWeek: d.toLocaleDateString('zh-HK', { weekday: 'short' }),
                    displayDate: d.toLocaleDateString('zh-HK', { month: 'numeric', day: 'numeric' }),
                    isToday: i === 0
                });
            }

            return {
                loading: true,
                loadingText: '正在從公開 EPG 伺服器下載真實香港電視節目 Feed...',
                errorMsg: '',
                searchQuery: '',
                showLiveModal: false,
                now: new Date(),
                availableDays: daysList,
                selectedDateStr: daysList[0].dateStr,
                channels: [],

                init() {
                    setInterval(() => {
                        this.now = new Date();
                    }, 1000);

                    this.fetchRealFeed();
                },

                async fetchRealFeed() {
                    this.loading = true;
                    this.errorMsg = '';
                    this.loadingText = '正在下載香港電視 EPG XMLTV 數據源...';

                    try {
                        // 使用公開的香港 EPG XMLTV 數據源透過 CORS 代理讀取
                        const xmlUrl = 'https://epg.pw/xmltv/epg_HK.xml';
                        const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(xmlUrl);
                        
                        const response = await fetch(proxyUrl);
                        if (!response.ok) throw new Error('無法連線至 EPG 數據源伺服器');
                        
                        const xmlText = await response.text();
                        this.loadingText = '正在解析節目表數據...';
                        
                        const parser = new DOMParser();
                        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                        
                        // 解析頻道
                        const channelNodes = xmlDoc.getElementsByTagName('channel');
                        let channelsMap = {};
                        for (let node of channelNodes) {
                            let id = node.getAttribute('id');
                            let nameNode = node.getElementsByTagName('display-name')[0];
                            let name = nameNode ? nameNode.textContent : id;
                            channelsMap[id] = {
                                id: id,
                                name: name,
                                programs: []
                            };
                        }
                        
                        // 解析節目
                        const progNodes = xmlDoc.getElementsByTagName('programme');
                        for (let node of progNodes) {
                            let channelId = node.getAttribute('channel');
                            let startStr = node.getAttribute('start'); // 格式: YYYYMMDDHHmmss ZZZZ
                            let titleNode = node.getElementsByTagName('title')[0];
                            let descNode = node.getElementsByTagName('desc')[0];
                            
                            if (channelsMap[channelId]) {
                                let title = titleNode ? titleNode.textContent : '未知節目';
                                let desc = descNode ? descNode.textContent : '暫無詳細節目介紹。';
                                
                                if (startStr && startStr.length >= 12) {
                                    let year = startStr.slice(0, 4);
                                    let month = startStr.slice(4, 6);
                                    let day = startStr.slice(6, 8);
                                    let hour = startStr.slice(8, 10);
                                    let minute = startStr.slice(10, 12);
                                    let dateStr = `${year}-${month}-${day}`;
                                    let timeStr = `${hour}:${minute}`;
                                    
                                    channelsMap[channelId].programs.push({
                                        date: dateStr,
                                        time: timeStr,
                                        title: title,
                                        description: desc
                                    });
                                }
                            }
                        }
                        
                        // 過濾出有節目資料的頻道
                        this.channels = Object.values(channelsMap).filter(c => c.programs.length > 0);
                        if (this.channels.length === 0) {
                            throw new Error('未能在 Feed 中找到有效的香港電視頻道資料');
                        }

                    } catch (err) {
                        console.error(err);
                        this.errorMsg = '載入真實 Feed 失敗：' + err.message + '（可能受限於網路或代理伺服器回應）';
                    } finally {
                        this.loading = false;
                    }
                },

                selectDate(dateStr) {
                    this.selectedDateStr = dateStr;
                },

                getSelectedDateLabel() {
                    const found = this.availableDays.find(d => d.dateStr === this.selectedDateStr);
                    return found ? `${found.displayDate} (${found.dayOfWeek})` : this.selectedDateStr;
                },

                getChannelPrograms(channel) {
                    return channel.programs.filter(p => p.date === this.selectedDateStr);
                },

                timeToMinutes(timeStr) {
                    const [hours, minutes] = timeStr.split(':').map(Number);
                    return hours * 60 + minutes;
                },

                getCurrentTimeMinutes() {
                    return this.now.getHours() * 60 + this.now.getMinutes();
                },

                getCurrentProgramForChannel(channel) {
                    const progs = this.getChannelPrograms(channel);
                    if (!progs || progs.length === 0) return { title: '暫無節目', time: '--:--', description: '' };
                    
                    const currentMins = this.getCurrentTimeMinutes();
                    let activeProg = progs[0];

                    for (let i = 0; i < progs.length; i++) {
                        const startMins = this.timeToMinutes(progs[i].time);
                        if (currentMins >= startMins) {
                            activeProg = progs[i];
                        } else {
                            break;
                        }
                    }
                    return activeProg;
                },

                get filteredChannels() {
                    return this.channels.filter(channel => {
                        const query = this.searchQuery.toLowerCase();
                        const dailyProgs = this.getChannelPrograms(channel);
                        return channel.name.toLowerCase().includes(query) || 
                            channel.id.toLowerCase().includes(query) ||
                            dailyProgs.some(p => p.title.toLowerCase().includes(query) || p.description.toLowerCase().includes(query));
                    });
                }
            }
        }
    </script>
</body>
</html>
